name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pull requests from forks get no secrets; they build an unsigned APK instead.
      HAS_SIGNING_KEY: ${{ secrets.SQUISH_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SQUISH_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/squish-release.jks"
          echo "SQUISH_KEYSTORE_FILE=$RUNNER_TEMP/squish-release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          SQUISH_KEYSTORE_PASSWORD: ${{ secrets.SQUISH_KEYSTORE_PASSWORD }}
          SQUISH_KEY_ALIAS: ${{ secrets.SQUISH_KEY_ALIAS }}
          SQUISH_KEY_PASSWORD: ${{ secrets.SQUISH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: squish-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
